services:
  backend:
    image: alexriviere/dockerdemo:backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/tickets')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    image: alexriviere/dockerdemo:frontend-v3
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy